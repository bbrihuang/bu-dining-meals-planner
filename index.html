<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Plan dining hall meals around your calories and macros, from what's on the menu today." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Dining Hall Planner</title>
    <script>
      // Set the theme before the page paints, so dark mode never flashes white.
      (function () {
        var theme = 'light';
        try {
          theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) {}
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        // The browser's own toolbar colour, to match (the stylesheet isn't loaded yet, so the values are spelled out).
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute('content', theme === 'dark' ? '#0c0c0d' : '#ffffff');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
